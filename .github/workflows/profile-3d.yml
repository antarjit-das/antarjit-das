name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # Daily at 18:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Sync 3D SVGs to assets fallback
        run: |
          mkdir -p assets
          if [ -f profile-3d-contrib/profile-night-view.svg ]; then
            cp profile-3d-contrib/profile-night-view.svg assets/profile-3d-contrib.svg
          fi
          if [ -f profile-3d-contrib/profile-green-animate.svg ]; then
            cp profile-3d-contrib/profile-green-animate.svg assets/profile-3d-contrib-light.svg
          fi

      - name: Commit & push SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: update 3D contribution city"
            git push
          fi
